pre-commit:
  piped: true
  jobs:
    - name: format-staged
      run: bun run prettier --write {staged_files}
      glob: "**/*.{ts,tsx,js,jsx,mjs,json,md,css}"
      stage_fixed: true
    - name: lint-fix-octavian
      run: bun run oxlint --fix {staged_files}
      glob: "{scripts,packages/octavian}/**/*.{ts,tsx,js,jsx}"
      stage_fixed: true
    - name: lint-fix-vibratone
      run: bun apps/vibratone/node_modules/eslint/bin/eslint.js --config apps/vibratone/eslint.config.js --fix {staged_files}
      glob: "apps/vibratone/**/*.{ts,tsx,js,jsx,svelte}"
      stage_fixed: true
    - name: package-lock-check
      run: bun scripts/hooks/package-lock-check.ts
      glob: "{package.json,apps/*/package.json,packages/*/package.json,bun.lock}"
    - name: typecheck
      run: bun run typecheck

pre-push:
  parallel: true
  jobs:
    - name: format-check
      run: bun run format:check
    - name: lint
      run: bun run lint
    - name: typecheck
      run: bun run typecheck
    - name: typecheck-test
      run: bun run typecheck:test
    - name: test
      run: bun run test:ci

post-checkout:
  jobs:
    - run: bun scripts/hooks/post-checkout.ts {1} {2} {3}

post-merge:
  jobs:
    - run: bun scripts/hooks/post-merge.ts
